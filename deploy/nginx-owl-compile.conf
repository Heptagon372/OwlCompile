# OWL COMPILE: nginx가 이미 80·443을 쓰는 서버에서 Caddy 대신 쓴다 (deploy/lightsail-launch.sh가 자동으로 고른다).
# owl.example.com 을 내 도메인으로 바꾼다. HTTPS(listen 443 ssl, 인증서)는 certbot --nginx 가 이 파일에 붙인다.
# 같은 서버의 다른 사이트 설정은 건드리지 않는다.
server {
    listen 80;
    listen [::]:80;
    server_name owl.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        # 실시간 스트림(SSE)이 버퍼에 막히지 않게
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
